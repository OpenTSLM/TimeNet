# Release notes for TimeNet, generated from the Conventional Commit subjects that squash merges
# leave on main. Used by .github/workflows/release.yml, once per package. Preview the next timenet
# release locally with (use timenet-connectors for the other package):
#   uvx git-cliff==2.14.2 --include-path 'packages/timenet/**' \
#     --tag-pattern '^(timenet-)?v[0-9]+\.[0-9]+\.[0-9]+$' --unreleased --bump --strip header

[changelog]
header = ""
body = """
{%- macro entry(commit) -%}
- {% if commit.breaking %}**Breaking:** {% endif %}\
{% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | split(pat="\n") | first | trim | upper_first }}
{%- endmacro -%}
{% if version and version is containing("-v") %}{% set package = version | split(pat="-v") | first %}{% set v = version | split(pat="-v") | last %}
[![{{ package }} {{ v }}](https://img.shields.io/badge/{{ package | replace(from="-", to="--") }}-{{ v }}-blue?logo=pypi&logoColor=white)](https://pypi.org/project/{{ package }}/{{ v }}/)
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits | filter(attribute="breaking", value=true) %}
{{ self::entry(commit=commit) }}
{%- endfor %}
{%- for commit in commits %}{% if not commit.breaking %}
{{ self::entry(commit=commit) }}
{%- endif %}{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
# Only release tags count. This skips the registry-dev/... and backup/... tags. release.yml narrows
# it to one package with --tag-pattern; the legacy vX.Y.Z tags count for both packages.
tag_pattern = "^((timenet|timenet-connectors)-)?v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "newest"
protect_breaking_commits = true
filter_commits = false
# Link PR numbers explicitly, so they also work outside this repository's GitHub pages.
commit_preprocessors = [
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/OpenTSLM/TimeNet/pull/${1}))" },
]
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore: start .* development", skip = true },
  { message = "^feat[(!:]", group = "<!-- 0 -->Features" },
  { message = "^fix[(!:]", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf[(!:]", group = "<!-- 2 -->Performance" },
  { message = "^refactor[(!:]", group = "<!-- 3 -->Refactoring" },
  { message = "^docs[(!:]", group = "<!-- 4 -->Documentation" },
  { message = "^(build|ci|chore|test|style)[(!:]", group = "<!-- 5 -->Maintenance" },
  { message = ".*", group = "<!-- 6 -->Other" },
]

[bump]
# Pre-1.0: a breaking change bumps the minor version, a feature bumps the minor version too.
features_always_bump_minor = true
breaking_always_bump_major = false
