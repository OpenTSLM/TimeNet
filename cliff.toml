# Release notes for TimeNet. Each note comes from the Conventional Commit subject that a squash
# merge leaves on main. .github/workflows/release.yml uses this file once for each package. To
# preview the next timenet release, run this command. For timenet-connectors, change the package
# name:
#   uvx git-cliff==2.14.2 --include-path 'packages/timenet/**' \
#     --tag-pattern '^(timenet-)?v[0-9]+\.[0-9]+\.[0-9]+$' --unreleased --bump --strip header

[changelog]
header = ""
body = """
{%- macro entry(commit) -%}
- {% if commit.breaking %}**Breaking:** {% endif %}\
{% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | split(pat="\n") | first | trim | upper_first }}
{%- endmacro -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits | filter(attribute="breaking", value=true) %}
{{ self::entry(commit=commit) }}
{%- endfor %}
{%- for commit in commits %}{% if not commit.breaking %}
{{ self::entry(commit=commit) }}
{%- endif %}{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
topo_order = false
sort_commits = "newest"
protect_breaking_commits = true
filter_commits = false
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore: start .* development", skip = true },
  { message = "^feat[(!:]", group = "<!-- 0 -->Features" },
  { message = "^fix[(!:]", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf[(!:]", group = "<!-- 2 -->Performance" },
  { message = "^refactor[(!:]", group = "<!-- 3 -->Refactoring" },
  { message = "^docs[(!:]", group = "<!-- 4 -->Documentation" },
  { message = "^(build|ci|chore|test|style)[(!:]", group = "<!-- 5 -->Maintenance" },
  { message = ".*", group = "<!-- 6 -->Other" },
]

[bump]
# Before version 1.0, a breaking change and a feature both raise the minor version.
features_always_bump_minor = true
breaking_always_bump_major = false
