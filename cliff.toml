# Release notes for TimeNet, generated from the Conventional Commit subjects that squash merges
# leave on main. Used by .github/workflows/release.yml. Preview the next release locally with:
#   uvx git-cliff==2.14.2 --unreleased --bump --strip header

[changelog]
header = ""
body = """
{%- macro entry(commit) -%}
- {% if commit.breaking %}**Breaking:** {% endif %}\
{% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | split(pat="\n") | first | trim | upper_first }}
{%- endmacro -%}
{% if version %}{% set v = version | trim_start_matches(pat="v") %}
[![timenet {{ v }}](https://img.shields.io/badge/timenet-{{ v }}-blue?logo=pypi&logoColor=white)](https://pypi.org/project/timenet/{{ v }}/) \
[![timenet-connectors {{ v }}](https://img.shields.io/badge/timenet--connectors-{{ v }}-blue?logo=pypi&logoColor=white)](https://pypi.org/project/timenet-connectors/{{ v }}/)
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits | filter(attribute="breaking", value=true) %}
{{ self::entry(commit=commit) }}
{%- endfor %}
{%- for commit in commits %}{% if not commit.breaking %}
{{ self::entry(commit=commit) }}
{%- endif %}{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
# Only plain release tags count. This skips the registry-dev/... and backup/... tags.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "newest"
protect_breaking_commits = true
filter_commits = false
# Link PR numbers explicitly, so they also work outside this repository's GitHub pages.
commit_preprocessors = [
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/OpenTSLM/TimeNet/pull/${1}))" },
]
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore: start .* development", skip = true },
  { message = "^feat[(!:]", group = "<!-- 0 -->Features" },
  { message = "^fix[(!:]", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf[(!:]", group = "<!-- 2 -->Performance" },
  { message = "^refactor[(!:]", group = "<!-- 3 -->Refactoring" },
  { message = "^docs[(!:]", group = "<!-- 4 -->Documentation" },
  { message = "^(build|ci|chore|test|style)[(!:]", group = "<!-- 5 -->Maintenance" },
  { message = ".*", group = "<!-- 6 -->Other" },
]

[bump]
# Pre-1.0: a breaking change bumps the minor version, a feature bumps the minor version too.
features_always_bump_minor = true
breaking_always_bump_major = false
