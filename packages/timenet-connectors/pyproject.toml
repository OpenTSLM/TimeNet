[project]
name = "timenet-connectors"
version = "0.1.0"
description = "Dataset connectors for TimeNet: dataset-specific logic to fetch and convert sources into the TimeF format."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "The TimeNet authors" }]
keywords = ["time-series", "datasets", "timef", "machine-learning", "connectors", "etl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "aiofiles>=24.1",
    "httpx>=0.28",
    "jaxtyping>=0.3",
    "numpy>=2.1",
    "pyarrow>=21",
    # [build] pulls PyYAML + jsonschema: connectors load and validate their card YAML at build time.
    "timenet[build]>=0.0.1",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://timenet.ai"
Documentation = "https://docs.timenet.ai/"
Repository = "https://github.com/OpenTSLM/TimeNet"
Issues = "https://github.com/OpenTSLM/TimeNet/issues"

[project.scripts]
timenet-build = "timenet_connectors.builder.cli:main"

[project.entry-points."timenet.builders"]
connectors = "timenet_connectors.builder.backend:ConnectorBuilder"

[tool.uv.sources]
# Dev-time override so the workspace resolves timenet locally. This is uv-only
# and never reaches published metadata; Requires-Dist comes from the floor above.
timenet = { workspace = true }

[tool.uv.build-backend]
# Connector tests live beside their connector (datasets/<org>/<name>/tests/, incl. binary fixtures).
# Keep them out of the built distributions.
source-exclude = ["**/tests"]
wheel-exclude = ["**/tests"]

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"
