[project]
name = "timenet-connectors"
version = "0.0.1"
description = "Dataset connectors for TimeNet: dataset-specific logic to fetch and convert sources into the TimeF format."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "jaxtyping>=0.3",
    "numpy>=2.1",
    "pyarrow>=21",
    # [curation] pulls PyYAML + jsonschema: connectors load and validate their card YAML at build time.
    "timenet[curation]>=0.0.1",
    "typer>=0.12",
]

[project.optional-dependencies]
# Real HuggingFace downloads need huggingface_hub; base users who only curate synthetic/offline
# datasets don't. Connectors lazily import it and raise an actionable error if it's missing.
huggingface = ["huggingface_hub>=0.24"]
# PhysioNet connectors read WFDB records and download archives from the physionet-open S3 bucket via
# boto3; wfdb pulls requests + scipy. All imported lazily with an actionable error when absent.
physionet = ["wfdb>=4.1", "boto3>=1.34"]
# Plain HTTP downloads (Zenodo, GitHub, and other hosts) use requests via bases/http.py, imported
# lazily with an actionable error when absent.
http = ["requests>=2.31"]

[project.scripts]
timenet-curate = "timenet_connectors.curate.cli:main"

[tool.uv.sources]
# Dev-time override so the workspace resolves timenet locally. This is uv-only
# and never reaches published metadata; Requires-Dist comes from the floor above.
timenet = { workspace = true }

[tool.uv.build-backend]
# Connector tests live beside their connector (datasets/<org>/<name>/tests/, incl. binary fixtures).
# Keep them out of the built distributions.
source-exclude = ["**/tests"]
wheel-exclude = ["**/tests"]

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"
