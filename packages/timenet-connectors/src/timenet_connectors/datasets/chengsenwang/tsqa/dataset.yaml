# yaml-language-server: $schema=https://docs.timenet.ai/schemas/dataset-card-v1.schema.json
# Dataset Card for the chengsenwang/tsqa connector: the single source for this dataset's metadata.
# The connector loads it via DatasetMetadata.from_yaml(); the builder compiles it plus the schema
# derived from the data into manifest.json.
yaml_schema_version: 1
dataset_id: chengsenwang/tsqa
dataset_version: 1.1.0
name: TSQA
description: >-
  Time-series question answering: a series plus a question/answer per record.
  Generated 80/10/10 train/validation/test partitions, stratified by question category
  and grouped by identical parsed series with seed 42. These are TimeNet-generated
  partitions, not official source splits; achieved sizes may differ to keep groups intact.
license: Apache-2.0
source_url: https://huggingface.co/datasets/ChengsenWang/TSQA
domains:
  - general
tags:
  - qa
  - time-series
  - huggingface
