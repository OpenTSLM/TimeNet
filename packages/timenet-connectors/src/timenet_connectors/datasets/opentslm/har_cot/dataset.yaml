# yaml-language-server: $schema=https://docs.timenet.ai/schemas/dataset-card-v1.schema.json
yaml_schema_version: 1
dataset_id: opentslm/har-cot
dataset_version: 1.0.0
name: HAR-CoT
description: >-
  85,482 windows of triaxial accelerometer data (68,542 train, 8,718 validation, 8,222 test).
  Each window has one of eight activity labels and a chain-of-thought rationale. A window is
  2.56 seconds at 50 Hz, with 128 values for each axis. OpenTSLM merged the windows from DaLiAc,
  DOMINO, HHAR, PAMAP2, RealWorld and the Shoaib et al. datasets, and kept only the activities
  that all of them have. The release states no unit. The values are in meters per second squared,
  because a resting window has a magnitude of about 9.8. The release keeps no subject or source
  dataset of a window. GPT-4o (gpt-4o-2024-08-06, temperature 0.3, seed 42) wrote each rationale
  from a plot of the window, the correct label, and one dissimilar label. The dataset does not
  keep that prompt, because it names the correct label. In 216 windows (158 train, 35 validation,
  23 test), the rationale concludes with the dissimilar label instead of the correct one. The
  dataset keeps these windows as released.
license: MIT
source_url: https://polybox.ethz.ch/index.php/s/kD74GnMYxn3HBEM
citation: >-
  Langer, P., et al. (2025). OpenTSLM: Time-Series Language Models for Reasoning over Multivariate
  Medical Text- and Time-Series Data. https://doi.org/10.48550/arXiv.2510.02410
domains:
  - activity
  - motion
tags:
  - har
  - accelerometer
  - classification
  - cot
  - generated-supervision
