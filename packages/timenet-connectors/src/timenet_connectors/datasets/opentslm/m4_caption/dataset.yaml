dataset_id: opentslm/m4-caption
dataset_version: 1.0.0
name: M4-Caption
description: >-
  M4-Caption is a dataset introduced by OpenTSLM, derived from the M4 forecasting competition.
  Each series has one English caption that GPT-4o wrote from a plot of the series, with the prompt
  "Generate a detailed caption for the following time-series data:". M4 has 100,000 series, but
  706 have a caption API error message instead of a caption, such as "Error generating caption:
  Connection error.". This dataset leaves them out, so it has 99,294 series: 79,436 train,
  9,929 validation and 9,929 test.

  The series contain the full M4 training history, without the forecast horizon, timestamps or a
  unit. Each record includes the M4 id and frequency. Each task asks for the caption with the
  prompt from OpenTSLM's loader: "Please generate a detailed caption for this time-series,
  describing it as accurately as possible."

  The 80/10/10 split is stratified by M4 frequency. Each of the 90 pairs of series with equal
  values stays in one split. This differs from the random split in OpenTSLM's loader.

  The M4 series are under CC BY 4.0, the license of the M4 copy in the Monash Time Series
  Forecasting Archive, for example https://zenodo.org/records/4656480. The M4 organizers state no
  license in their own repository. OpenTSLM releases the captions under MIT.
license: CC-BY-4.0
license_url: https://creativecommons.org/licenses/by/4.0/
source_url: https://polybox.ethz.ch/index.php/s/MT3y9WdEebT8wfj
citation: >-
  Langer, P., et al. (2025). OpenTSLM: Time-Series Language Models for Reasoning over Multivariate
  Medical Text- and Time-Series Data. https://doi.org/10.48550/arXiv.2510.02410. M4 series:
  Makridakis, S., Spiliotis, E., & Assimakopoulos, V. (2020). The M4 Competition: 100,000 time series
  and 61 forecasting methods. International Journal of Forecasting, 36(1), 54-74. Makridakis, S.,
