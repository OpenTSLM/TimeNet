# yaml-language-server: $schema=https://docs.timenet.ai/schemas/dataset-card-v1.schema.json
yaml_schema_version: 1
dataset_id: mikeam/time-series-reasoning
dataset_version: 1.0.0
name: Time Series Reasoning
description: >-
  Multiple-choice reasoning over 8,787 synthetic time series, each with a
  written scenario, its metadata, and the Python code that generates it.
  Three tasks, as the authors pose them: pick the series' description among
  four (7,815, split 5,779 train, 1,000 validation and 1,036 test, with three
  domains held out for test); answer a question about one series (97,330);
  and answer a question comparing a series with a counterfactual version of
  it (132,689). The release gives the two question tasks no split. Prompts
  are the authors' text with lettered options, and targets are letters.
# The Hub repository declares no license. The authors' code repository,
# behavioral-data/TSandLanguage, is MIT-licensed, and this card applies that
# license to the release.
license: MIT
license_url: https://github.com/behavioral-data/TSandLanguage/blob/d4e748cb69a3909205722147855f31e807489c55/LICENSE.md
source_url: https://huggingface.co/datasets/mikeam/time-series-reasoning
citation: >-
  Merrill et al. Language Models Still Struggle to Zero-shot Reason about
  Time Series. https://arxiv.org/abs/2404.11757
# Every series is synthetic, generated by code from a written scenario, so it is `general`. The
# scenarios' domains, such as health or energy, aren't measurements from those fields.
domains:
  - general
tags:
  - multiple-choice
  - question-answering
  - counterfactual-reasoning
  - synthetic
  - generated-supervision
  - huggingface
