# yaml-language-server: $schema=https://docs.timenet.ai/schemas/dataset-card-v1.schema.json
yaml_schema_version: 1
dataset_id: emip/programmer-gaze
dataset_version: 1.0.0
name: EMIP Programmer Gaze
description: >-
  Eye fixations of 216 programmers while they read two short programs (rectangle and vehicle) to
  answer a comprehension question, recorded with an SMI RED250 eye tracker at 250 Hz on a
  1920x1080 screen. Each code-reading trial is one record with four irregular series,
  one value per fixation: gaze x and y in pixels, fixation duration in milliseconds, and mean pupil
  diameter in millimeters. The connector detects fixations from the raw right-eye samples with a
  dispersion-threshold (I-DT) pass: at most 25 px dispersion and at least 80 ms. It drops samples
  where the tracker lost the eye, and no fixation spans such a gap. Each record has one
  classification task whose target is the participant's self-reported programming expertise
  (none 11, low 45, medium 120, high 40 participants). 207 participants read Java, 5 Python and 4
  Scala. Record metadata keeps the participant id, so a split can keep each participant on one
  side. Annotations add the expertise in the experiment language, the trial order, and whether
  the comprehension answer was correct. The release defines no train/test split.
license: CC-BY-4.0
source_url: https://osf.io/53kts
citation: >-
  Bednarik, R., Busjahn, T., Gibaldi, A., Ahadi, A., et al. (2020). EMIP: The eye movements in
  programming dataset. Science of Computer Programming, 198, 102520.
  https://doi.org/10.1016/j.scico.2020.102520
