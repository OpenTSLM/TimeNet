# yaml-language-server: $schema=https://docs.timenet.ai/schemas/dataset-card-v1.schema.json
yaml_schema_version: 1
dataset_id: time-mqa/tsqa
dataset_version: 1.0.0
name: Time-MQA TSQA
description: >-
  The Time Series Question Answering dataset of the Time-MQA paper: question-and-answer pairs about
  time series from twelve application areas, in five task families: anomaly detection,
  classification, forecasting, imputation, and open-ended reasoning. The release prints each series
  in the text of its question as a list of decimal numbers. The dataset keeps each printed series as
  a Record of its own, with float64 values on an ordinal axis, because the release states no unit
  and no sampling rate. The prompt of a task is the question with a placeholder, such as
  "<series 1>", in place of each printed series. The release has no split, so no task has one. It
  repeats some question-and-answer pairs, and the dataset keeps each repeat as released. The Hub
  repo is gated with automatic approval, so a build needs HF_TOKEN for a Hub account that accepted
  its terms; the data itself is under Apache-2.0.

  The anomaly detection file has 37,000 questions, each about one series of 8 to 64 values from
  environmental sensors, ECG, cloud monitoring, web servers, machine sensors, and traffic. Each
  question becomes a classification task whose target is the released label, "Normal Point" or
  "Anomaly Point". The file repeats 1,146 question-and-answer pairs.

  The classification file has 37,000 questions about human activity, half from WISDM and half from
  Daphnet. A WISDM question prints 10 timestamps of a phone accelerometer at 20 Hz as 30 values, the
  X, Y, and Z values of each timestamp in turn, and asks for one of six activities. A Daphnet
  question prints one timestamp of accelerometers on the ankle, thigh, and hip at 64 Hz as 9 values,
  and asks whether the gait froze. The dataset gives each window one Signal per axis, as the
  question text lays the values out, with a regular axis at the stated rate. The WISDM values are in
  meters per second squared, because the question states that 10 represents 1g; the Daphnet values
  are in milli-g, as the question states. Each question becomes a classification task whose target
  is the released label. The file repeats 38 question-and-answer pairs.

  The two forecasting-and-imputation files have 42,557 forecasting and 38,657 imputation questions
  about series from web traffic, health, nature, finance, energy, and transport. Of the forecasting
  questions, 37,390 print a series of 64 to 256 values and ask for its next 8 to 32 values; each
  becomes a forecasting task whose input Record holds the printed series and whose target Record
  holds the released predictions. The other 5,167 come from Time-MMD: a text about a market, an
  epidemic, gasoline prices, or traffic, sometimes with a list of recent values, and a question
  that asks for a prediction in words. Each becomes an answer task whose target is the released
  answer text; the 1,989 that print a list of values give it as a Record. Each imputation question
  prints a series of 64 to 256 values with 'X' in place of 4 to 12 of them, and the answer prints
  the complete series. Each becomes an editing task whose input Record holds the printed series
  with a missing value at each 'X', and whose target Record holds the complete series. The two
  files repeat 8 question-and-answer pairs, and 5 pairs are in both files.

  The open-ended file has 37,613 questions that GPT-4o wrote about series from healthcare, nature,
  the web, energy, and traffic: 19,424 open questions, 11,273 multiple-choice questions, and 6,916
  true-or-false questions. The question_format column names the format, and the task_type column
  names the kind of question in the words of the row, such as "trend analysis" or "trend_analysis".
  The dataset keeps both in the task metadata as released. A question prints zero to six series,
  for example one series for each choice, and each becomes a Record of its own. Each question
  becomes an answer task whose target is the released answer text, which may print a series too.
  Sixteen further rows have an empty cell and no question, so the dataset skips them. The file
  repeats 15 question-and-answer pairs.
license: Apache-2.0
source_url: https://huggingface.co/datasets/Time-MQA/TSQA
citation: >-
