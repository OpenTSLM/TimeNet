# yaml-language-server: $schema=https://docs.timenet.ai/schemas/dataset-card-v1.schema.json
# Dataset Card for the zenodo/code-15 connector: the single source for this dataset's metadata.
# The connector loads it via DatasetMetadata.from_yaml(); the builder compiles it plus the schema
# derived from the data into manifest.json.
#
# Each exam has an age task and a connector-defined classification task.
# The age task uses split test, following Lima et al.'s held-out CODE-15% cohort.
# The classification task uses split train, following Ribeiro et al.'s CODE training data.
# It extends their six labels with normal_ecg and abnormal_unspecified. See the README.
# Signals are 12 leads at 400 Hz in millivolts: the published values halved, without the zero
# padding. The README says how to rebuild the authors' 4096-sample input.
yaml_schema_version: 1
dataset_id: zenodo/code-15
dataset_version: 1.0.1
name: CODE-15%
description: >-
  12-lead ECGs of the Telehealth Network of Minas Gerais, Brazil (2010-2016), at
  400 Hz, with the patient's age and sex, six abnormality labels, normal and
  unspecified-abnormal labels, and mortality follow-up. The release has
  345,779 exams from 233,770 patients. The dataset holds the 345,109 whose
  trace isn't zero everywhere, from 233,480 patients.
license: CC-BY-4.0
source_url: https://zenodo.org/records/4916206
citation: >-
  Ribeiro, A.H., Paixao, G.M.M., Lima, E.M. et al. CODE-15%: a large scale
  annotated dataset of 12-lead ECGs. Zenodo (2021).
  https://doi.org/10.5281/zenodo.4916206
domains:
  - cardiology
tags:
  - ecg
  - 12-lead
  - age-prediction
  - multi-label
