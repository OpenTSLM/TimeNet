# yaml-language-server: $schema=https://docs.timenet.ai/schemas/dataset-card-v1.schema.json
# Dataset Card for the pandalin98/enginemt-qa connector: the single source for this dataset's metadata.
#
# Training convention: the tasks are the authors' four stages, one task per published QA pair, split as
# the authors train and test (train_qa.jsonl, test_qa.jsonl). Closed questions are classifications over
# their option letters, as the authors' model answers and their metric scores. 1,769 closed pairs with an
# empty answer have no task. Signals are the release's z-scored values at 1 Hz, 33 unnamed channels per
# 600-step cycle.
yaml_schema_version: 1
dataset_id: pandalin98/enginemt-qa
dataset_version: 1.0.0
name: EngineMT-QA
description: >-
  Aero-engine time-series question answering over simulated N-CMAPSS flight cycles: 142,273 labelled
  QA pairs (100,296 train, 41,977 test) in four tasks. Understanding and Perception ask about one
  600-step cycle of 33 z-scored channels; Reasoning and Decision-Making ask about 10 cycles.
  Perception and Reasoning are multiple choice; Understanding and Decision-Making are open-ended
  answers written with LLMs and checked by experts.
license: MIT
source_url: https://huggingface.co/datasets/pandalin98/EngineMT-QA
citation: >-
  Wang et al. ITFormer: Bridging Time Series and Natural Language for Multi-Modal QA with
  Large-Scale Multitask Dataset. ICML 2025. https://arxiv.org/abs/2506.20093
domains:
  - industrial
tags:
  - aero-engine
  - n-cmapss
  - simulated
  - question-answering
  - classification
  - generated-supervision
  - huggingface
