# yaml-language-server: $schema=https://docs.timenet.ai/schemas/dataset-card-v1.schema.json
# Dataset Card for the pandalin98/enginemt-qa connector: the single source for this dataset's metadata.
#
# Training convention: the tasks are the authors' four stages, one task per labelled QA pair, split as
# the authors' files are (train_qa.jsonl, test_qa.jsonl). Closed questions are classifications over
# their option letters. 1,769 closed pairs with an empty answer have no task. A single-row question
# reads its row at 1 Hz. A multi-row question reads the first 60 steps of its 10 rows, joined on an
# ordinal axis, as the authors' code does. The padding zeros at the end of a flight are not stored.
# The train file holds copies of 4,039 test lines. Their tasks name repeated_across_splits in their
# source_issues metadata.
yaml_schema_version: 1
dataset_id: pandalin98/enginemt-qa
dataset_version: 1.0.0
name: EngineMT-QA
description: >-
  Aero-engine time-series question answering over simulated N-CMAPSS flights: 142,273 labelled
  QA pairs (100,296 train, 41,977 test) in four tasks. Understanding and Perception ask about one
  10-minute window of 33 unnamed, scaled channels. Reasoning and Decision-Making ask about 10
  windows from successive flights. Perception and Reasoning are multiple choice. Understanding and
  Decision-Making are open-ended answers written with LLMs and checked by experts.
license: MIT
source_url: https://huggingface.co/datasets/pandalin98/EngineMT-QA
source_revision: ea2051a15512212976c22c1a075ec549c7d48eef
citation: >-
  Wang et al. ITFormer: Bridging Time Series and Natural Language for Multi-Modal QA with
  Large-Scale Multitask Dataset. ICML 2025. https://arxiv.org/abs/2506.20093
domains:
  - industrial
tags:
  - aero-engine
  - n-cmapss
  - simulated
  - question-answering
  - classification
  - generated-supervision
  - huggingface
