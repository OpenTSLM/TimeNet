# yaml-language-server: $schema=https://docs.timenet.ai/schemas/dataset-card-v1.schema.json
yaml_schema_version: 1
dataset_id: noaa/spaceweather-cot
dataset_version: 0.1.0
name: SpaceWeather-CoT
description: >-
  NOAA Space Weather Prediction Center Forecast Discussions paired with the solar and
  geomagnetic time series the forecaster analyzed: GOES X-ray flux (solar flares) and
  OMNI2 hourly solar-wind and Kp index values. Each record covers one 12-hourly
  issuance's 24-hour lookback window. The forecaster's own "24 hr Summary" text is a
  grounded, human-written rationale (not an LLM-generated caption) for the forecaster's
  own "Forecast" text, so the chain-of-thought in this dataset is the real forecast
  process, not distilled from a language model. The paired 3-Day Forecast product
  supplies NOAA's own numeric probability forecasts (max Kp, radio blackout and solar
  radiation storm chances) as scalar targets, enabling a direct model-vs-NOAA
  comparison. This 0.1.0 release covers March-December 2024, the first full year of
  the Forecast Discussion archive; later versions can extend the date range and
  satellite/coverage.
license: CC0-1.0
source_url: https://www.ngdc.noaa.gov/stp/space-weather/swpc-products/daily_reports/discussion/
