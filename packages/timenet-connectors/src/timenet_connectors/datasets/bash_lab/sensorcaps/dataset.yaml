# yaml-language-server: $schema=https://docs.timenet.ai/schemas/dataset-card-v1.schema.json
yaml_schema_version: 1
dataset_id: bash-lab/sensorcaps
dataset_version: 1.0.0
name: SensorCaps
description: >-
  35,960 SensorCaps v2 wearable IMU captioning examples from five activity datasets, with
  accelerometer and gyroscope readings and activity context, plus a magnetometer
  channel in PAMAP2. PAMAP2 signal names correct upstream channel-label errors.
  Caption feature summaries and narrations were generated by GPT-4o-mini for the
  LLaSA project and retain the original channel assumptions.
  Published PAMAP2 values also retain upstream missing-data processing consistent
  with zero filling before resampling; original gaps are not marked in the release.
license: Hippocratic-3.0
license_url: https://firstdonoharm.dev/version/3/0/cl-eco-extr-ffd-law-media-mil-my-soc-sv-tal-usta.html
source_url: https://huggingface.co/datasets/BASH-Lab/SensorCaps
citation: >-
  Imran et al. LLaSA: A Sensor-Aware LLM for Natural Language Reasoning of
  Human Activity from IMU Data. https://arxiv.org/abs/2406.14498
domains:
  - activity
  - motion
tags:
  - captioning
  - imu
  - accelerometer
  - gyroscope
  - magnetometer
  - generated-supervision
  - huggingface
