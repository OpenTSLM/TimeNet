name: HAI
description: >-
  The HAI security dataset as published: a hardware-in-the-loop power plant testbed (boiler,
  turbine, water treatment) recorded once per second in four versions (20.07, 21.03, 22.04 and
  23.05), with staged attacks on its control loops. Each of the 28 data files is one record with
  every data point as a float64 signal, named as in the file, with the quantity and unit that the
  HAI manual gives for it (no unit where the manual gives none). HAI's own attack labels are
  signals too: attack and attack_P1 to attack_P3 (20.07, 21.03), Attack (22.04) and the 23.05
  label files. No tasks; child datasets add them.
