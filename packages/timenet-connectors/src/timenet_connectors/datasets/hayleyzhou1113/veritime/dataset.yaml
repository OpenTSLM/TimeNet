# yaml-language-server: $schema=https://docs.timenet.ai/schemas/dataset-card-v1.schema.json
# Dataset Card for the hayleyzhou1113/veritime connector: the single source for this dataset's
# metadata.
#
# Training convention: one task per published row, under the authors' split. Scenario rows split
# randomly about 5:1 by the authors; knowledge rows keep their source datasets' splits. Scenario
# series are shared across questions and across the two splits; README.md documents it.
yaml_schema_version: 1
dataset_id: hayleyzhou1113/veritime
dataset_version: 1.0.0
name: VeriTime (TSRBench)
description: >-
  Time-series reasoning questions with process-verifiable chains of thought: 4,356 rows (3,201
  train, 1,155 test) over 3,095 distinct series. Scenario questions (anomaly detection, scenario
  attribution, inferential calculation) on synthetic ChatTS series, and knowledge questions on
  real ECG, EMG, household electricity and right whale audio. Each has a six-step DeepSeek-R1
  chain of thought and labels for steps 1, 2, 4 and 6.
license: Apache-2.0
source_url: https://huggingface.co/datasets/HayleyZhou1113/VeriTime
citation: >-
  Zhou et al. Time Series Reasoning via Process-Verifiable Thinking Data Synthesis and Scheduling
  for Tailored LLM Reasoning. ICML 2026. https://arxiv.org/abs/2602.07830
domains:
  - general
  - cardiology
  - health
  - energy
  - audio
tags:
  - question-answering
  - classification
  - chain-of-thought
  - process-supervision
  - generated-supervision
  - synthetic
  - huggingface
