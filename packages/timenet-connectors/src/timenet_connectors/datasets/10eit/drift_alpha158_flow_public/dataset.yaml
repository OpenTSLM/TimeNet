name: DRIFT Alpha158 public market replay
description: >
  Rebuild historical stock-factor windows directly from a fixed public OHLCV snapshot.
  The 98 matched observations cover 30 target companies in 11 sectors. Each record has
  four dated tasks, with categorical supervision from the archived DRIFT model and a
  pairwise realized-return winner confirmed against the independent price source.
