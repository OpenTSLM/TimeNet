yaml_schema_version: 2
dataset_id: chattsrepo/chatts-training-dataset
dataset_version: 1.0.0
name: ChatTS training dataset
description: >-
  Synthetic time series paired with questions and answers for ChatTS alignment,
  supervised fine-tuning, and instruction following. The five source configs are
  retained, with dev tasks in the validation split. Values have no published
  sampling times or physical units.
license: MIT
license_url: >-
