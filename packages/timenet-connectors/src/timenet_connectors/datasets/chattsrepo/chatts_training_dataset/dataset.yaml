source_url: https://huggingface.co/datasets/ChatTSRepo/ChatTS-Training-Dataset
citation: >-
  Xie et al. ChatTS: Aligning Time Series with LLMs via Synthetic Data for Enhanced
  Understanding and Reasoning. PVLDB 18(8), 2025. doi:10.14778/3742728.3742735.
domains:
