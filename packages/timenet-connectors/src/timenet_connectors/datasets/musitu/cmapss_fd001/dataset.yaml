name: NASA C-MAPSS FD001 Predictive Maintenance
description: >-
  NASA Ames C-MAPSS simulated turbofan engine histories in 30-cycle
  multivariate windows. Each task predicts remaining useful life in cycles.
  Engine IDs do not cross the train/validation partition. NASA official test
  engines are used for test-only endpoint evaluations.
