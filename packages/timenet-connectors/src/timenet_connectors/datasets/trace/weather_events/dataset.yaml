# yaml-language-server: $schema=https://docs.timenet.ai/schemas/dataset-card-v1.schema.json
yaml_schema_version: 1
dataset_id: trace/weather-events
dataset_version: 1.0.0
name: TRACE Weather Events
description: >-
  Weather station windows from the TRACE paper: NOAA GHCN-hourly data with
  seven channels at hourly, 4-hourly or daily cadence. The authors publish one
  window per NOAA Storm Events report, so some windows are copies that hold
  the same measurements. Each window is one Record, and its metadata names the
  window it copies. Each window that qualifies has its own tasks under the
  authors' splits: event-type classification, retrieval from a generated
  description, and forecasting of the last 24 values. The README gives the
  Record and task counts of the real archive. The authors' splits share
  measurements across splits. The README describes a split by time that does
  not.
# The original NOAA sources, GHCN-hourly observations ("Use Constraints") and the Storm Events
# Database ("Access & Use"), both list CC0-1.0 terms, but the descriptions are the TRACE authors'
# ChatGPT-generated text. Neither the TRACE archive, its Hugging Face mirror, nor the code
# repository states a license of its own, and the paper's CC BY-NC-ND 4.0 covers the paper only.
# We contacted the authors to clarify whether the release can be used under CC BY 4.0.
license: NONE
source_url: https://drive.google.com/file/d/1hX4D91QbXa0UQlgf6Jnf-1ii96gfp1aY/view
citation: >-
  Chen et al. TRACE: Grounding Time Series in Context for Multimodal Embedding
  and Retrieval. NeurIPS 2025. https://arxiv.org/abs/2506.09114
domains:
  - environment
tags:
  - classification
  - retrieval
  - forecasting
  - generated-supervision
  - weather
  - event-prediction
  - noaa
  - multivariate
