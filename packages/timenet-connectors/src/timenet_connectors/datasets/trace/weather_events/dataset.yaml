# yaml-language-server: $schema=https://docs.timenet.ai/schemas/dataset-card-v1.schema.json
yaml_schema_version: 1
dataset_id: trace/weather-events
dataset_version: 1.0.0
name: TRACE Weather Events
description: >-
  74,337 seven-channel NOAA GHCN-h weather station windows (temperature,
  precipitation, relative humidity, visibility, wind components, sky cover)
  at hourly, 4-hourly, and daily cadence, with the TRACE authors' train,
  validation, and test splits. 14,446 pre-event windows carry one NOAA Storm
  Events type each, as a nine-class classification task whose rationale is
  the event's NOAA narrative report. Windows end 0-4 days before their event,
  so the label is predicted, not observed, and the report describes what
  followed. 44,186 windows, event and non-event, also carry a captioning task
  whose target is the authors' ChatGPT-generated weather description, under
  the authors' retrieval split.
# The original NOAA sources, GHCN-hourly observations ("Use Constraints") and the Storm Events
# Database ("Access & Use"), both list CC0-1.0 terms, but the captions are the TRACE authors'
# ChatGPT-generated text. Neither the TRACE archive, its Hugging Face mirror, nor the code
# repository states a license of its own, and the paper's CC BY-NC-ND 4.0 covers the paper only.
# We contacted the authors to clarify whether the release can be used under CC BY 4.0.
license: NONE
source_url: https://drive.google.com/file/d/1hX4D91QbXa0UQlgf6Jnf-1ii96gfp1aY/view
citation: >-
  Chen et al. TRACE: Grounding Time Series in Context for Multimodal Embedding
  and Retrieval. NeurIPS 2025. https://arxiv.org/abs/2506.09114
domains:
  - environment
tags:
  - classification
  - captioning
  - generated-supervision
  - weather
  - event-prediction
  - noaa
  - multivariate
