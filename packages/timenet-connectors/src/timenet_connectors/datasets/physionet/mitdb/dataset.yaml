# yaml-language-server: $schema=https://docs.timenet.ai/schemas/dataset-card-v1.schema.json
# Dataset Card for the physionet/mitdb connector: the single source for this dataset's metadata.
# The connector loads it via DatasetMetadata.from_yaml(); the builder compiles it plus the schema
# derived from the data into manifest.json.
#
# Training convention: every reference label is a Record annotation, as the cardiologists wrote
# it. Each record has two TemporalLocalizationTasks, the outputs the authors' WFDB comparators
# score: its labelled beats (bxb) and its rhythm episodes (epicmp). Each beat also has a
# ClassificationTask whose target is its MIT code; grouping codes into the AAMI classes is the
# scorer's step, as in bxb. The release has no split. Signals are archival raw: both leads of
# each record at 360 Hz, in mV.
yaml_schema_version: 1
dataset_id: physionet/mitdb
dataset_version: 1.0.0
name: MIT-BIH Arrhythmia Database
description: >-
  48 half-hour two-lead ambulatory ECG recordings from 47 subjects, at 360 Hz, with about 110,000
  beat labels and rhythm labels from two cardiologists in consensus.
license: ODC-By-1.0
domains:
  - cardiology
  - health
tags:
  - ecg
  - arrhythmia
  - holter
  - beat-classification
  - physionet
source_url: https://physionet.org/content/mitdb/1.0.0/
