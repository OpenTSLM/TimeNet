# Dataset Card for the physionet/ecg-qa-cot connector.
# Human-authored metadata; the curator compiles this plus the schema derived from the data into
# manifest.json. The connector lives at datasets/<org>/<name>.py; its metadata declares the id.
#
# Training convention: each sample carries a ReasoningTask whose `answer` is the short evaluation
# label and whose `rationale` is the chain-of-thought target to fine-tune on. The multiple-choice
# candidates are stored as the `answer_options` annotation. Signals are archival raw (12 leads,
# 500 Hz, millivolt); reproduce OpenTSLM's training preprocessing (downsample to 100 Hz, per-lead
# z-normalize) at load time.
yaml_schema_version: 1
dataset_id: physionet/ecg-qa-cot
dataset_version: 1.0.0
name: ECG-QA CoT
description: >-
  12-lead PTB-XL ECGs paired with clinical questions, short answers, and chain-of-thought
  rationales for reasoning fine-tuning.
license: CC-BY-4.0
domains:
  - cardiology
  - health
tags:
  - ecg
  - qa
  - cot
  - physionet
