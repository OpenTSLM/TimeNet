name: CGMacros
description: >-
  Original CGMacros 1.0.0 participant recordings, meal events, photographs, and supplementary
  participant tables. Preserve the published one-minute glucose and activity readings, including
  missing values. Dates are shifted, local source timestamps, not asserted UTC times. No HEARTS
  preprocessing or benchmark tasks are included.
