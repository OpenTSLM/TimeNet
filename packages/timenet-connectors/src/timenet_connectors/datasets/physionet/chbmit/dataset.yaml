# yaml-language-server: $schema=https://docs.timenet.ai/schemas/dataset-card-v1.schema.json
# Dataset Card for the physionet/chbmit connector: the single source for this dataset's metadata.
# The connector loads it via DatasetMetadata.from_yaml(); the builder compiles it plus the schema
# derived from the data into manifest.json.
#
# Scope: cases chb01 to chb23 (22 children; chb21 is chb01 recorded 1.5 years later), with the 182
# seizures the dataset page states. chb24 is left out: it has no subject information, its summary
# leaves out 10 of its 22 files, and it holds the one file where a .seizures file and the summary
# disagree. See README.md.
#
# Record granularity: one record is one EDF file, not one case. An EDF file is continuous, while
# the gaps between the files of a case range from 2 s to four days. TimeNet cannot yet hold one
# signal with gaps (TNET-167), and an exhaustive seizure task over a whole case would state that no
# seizure happened in time nobody recorded. Each record carries `case_offset`, the seconds from the
# start of its case to its own start, so the gaps stay visible. The header dates are surrogates;
# only the time between the files of a case is real.
#
# Tasks: an exhaustive TemporalLocalizationTask for each file (an empty target when it holds no
# seizure), and a seizure / no-seizure ClassificationTask for each non-overlapping 2 s window. The
# 2 s window is the epoch of Shoeb and Guttag (ICML 2010), the paper the release ships. A window is
# `seizure` when it overlaps a marked seizure by any amount. Splits assign whole subjects.
yaml_schema_version: 1
dataset_id: physionet/chbmit
dataset_version: 1.0.0
name: CHB-MIT Scalp EEG Database
description: >-
  Scalp EEG of 22 children with intractable seizures, recorded for days at Children's Hospital
  Boston, with the onset and end of every seizure marked.
license: ODC-By-1.0
domains:
  - health
tags:
  - eeg
  - epilepsy
  - seizure-detection
  - physionet
source_url: https://physionet.org/content/chbmit/1.0.0/
