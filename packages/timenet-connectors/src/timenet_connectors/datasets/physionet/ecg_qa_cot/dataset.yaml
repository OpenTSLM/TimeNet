# yaml-language-server: $schema=https://docs.timenet.ai/schemas/dataset-card-v1.schema.json
# Dataset Card for the physionet/ecg-qa-cot connector: the single source for this dataset's metadata.
# The connector loads it via DatasetMetadata.from_yaml(); the builder compiles it plus the schema
# derived from the data into manifest.json.
#
# Training convention: each record carries an AnswerTask whose `target` is the short evaluation
# label and whose `rationale` is the chain-of-thought target to fine-tune on. The multiple-choice
# candidates are stored as the `answer_options` annotation. Signals are archival raw (12 leads,
# 500 Hz, millivolt); reproduce OpenTSLM's training preprocessing (downsample to 100 Hz, per-lead
# z-normalize) at load time.
yaml_schema_version: 1
dataset_id: physionet/ecg-qa-cot
dataset_version: 1.2.0
name: ECG-QA CoT
description: >-
  12-lead PTB-XL ECGs paired with clinical questions, short answers, and chain-of-thought
  rationales for reasoning fine-tuning. Each question carries a clinical context built from
  PTB-XL: the patient's age and sex, the recording device, and the signal-quality issues, extra
  beats, and pacemaker that PTB-XL records for the recording.
license: CC-BY-4.0
domains:
  - cardiology
  - health
tags:
  - ecg
  - qa
  - cot
  - physionet
source_url: https://github.com/StanfordBDHG/OpenTSLM
citation: >-
  Oh, J., Lee, G., Bae, S., Kwon, J., & Choi, E. (2023). ECG-QA: A Comprehensive Question Answering
  Dataset Combined With Electrocardiogram. Advances in Neural Information Processing Systems 36,
  66277-66288. Chain-of-thought rationales: Langer, P., et al. (2025). OpenTSLM: Time-Series
  Language Models for Reasoning over Multivariate Medical Text- and Time-Series Data.
  https://doi.org/10.48550/arXiv.2510.02410
parents:
  ptbxl: physionet/ptb-xl@1.0.0
