# yaml-language-server: $schema=https://docs.timenet.ai/schemas/dataset-card-v1.schema.json
# Dataset Card for the oxwearables/capture24 connector: the single source for this dataset's
# metadata. The connector loads it via DatasetMetadata.from_yaml().
#
# Training convention: the target of each ClassificationTask is the annotation text of the
# release. The dataset annotation `annotation_label_dictionary` maps each text to the six label
# schemes of the release (for example label:Walmsley2020). Map to a scheme at load time.
yaml_schema_version: 1
dataset_id: oxwearables/capture24
dataset_version: 1.0.0
name: CAPTURE-24
description: >-
  Wrist-worn Axivity AX3 accelerometry of 151 participants in free-living conditions, about a
  day each. Three axes in g at 100 Hz, as the release resamples them. Eight recordings jump
  forward once, and each stretch between jumps is its own segment. Wearable-camera images
  and sleep diaries annotate the activity with about 200 fine-grained labels from the
  Compendium of Physical Activities. Each annotated run is one classification task, and
  unannotated time has none. Each record keeps the age group and sex of its participant.
license: CC-BY-4.0
license_url: https://ora.ox.ac.uk/objects/uuid:99d7c092-d865-4a19-b096-cc16440cd001
source_url: https://ora.ox.ac.uk/objects/uuid:99d7c092-d865-4a19-b096-cc16440cd001
citation: >-
  Chan, S., Hang, Y., Tong, C., et al. (2024). CAPTURE-24: A large dataset of wrist-worn
  activity tracker data collected in the wild for human activity recognition. Scientific Data
  11, 1135. https://doi.org/10.1038/s41597-024-03960-3
domains:
  - activity
  - motion
tags:
  - har
  - accelerometer
  - wearable
  - wrist
  - classification
