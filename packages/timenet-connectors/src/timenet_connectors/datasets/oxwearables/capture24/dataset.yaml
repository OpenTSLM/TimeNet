name: CAPTURE-24
description: >-
  CAPTURE-24 holds about one day of wrist accelerometer data from each of 151 adults, recorded during normal daily life. Most of each day has activity labels that people coded from wearable-camera images and sleep diaries.
  The data was recorded in 2014 to 2016 in Oxfordshire. Each participant wore an Axivity AX3 accelerometer on the dominant wrist for about 24 hours. At the same time, a Vicon Autograph camera on the chest took an image every 20 to 40 seconds, and the participant kept a Whitehall II sleep diary. Annotators then coded the images and the diary into activity labels, with codes from the Compendium of Physical Activities.
