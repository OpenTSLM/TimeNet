# yaml-language-server: $schema=https://docs.timenet.ai/schemas/dataset-card-v1.schema.json
# Dataset Card for the oxwearables/capture24 connector: the single source for this dataset's metadata.
# The connector loads it via DatasetMetadata.from_yaml(); the builder compiles it plus the schema
# derived from the data into manifest.json.
#
# Training convention: the tasks are the authors' benchmark. Each 10 s window that
# prepare_data.make_windows keeps has one ClassificationTask per scheme benchmark.py scores
# (WillettsSpecific2018, Walmsley2020), split as benchmark.py runs it: P001-P100 train, P101-P151
# test. Signals are archival raw: each recording at 100 Hz, in g, with one Source per run between
# its gaps.
yaml_schema_version: 1
dataset_id: oxwearables/capture24
dataset_version: 1.0.0
name: CAPTURE-24
description: >-
  About a day of free-living wrist accelerometry from each of 151 participants, at 100 Hz, with
  activity labels from body-camera images and sleep diaries.
license: CC-BY-4.0
domains:
  - activity
  - motion
tags:
  - accelerometer
  - wearable
  - wrist
  - activity-recognition
source_url: https://ora.ox.ac.uk/objects/uuid:99d7c092-d865-4a19-b096-cc16440cd001
