name: HEARTS frozen test cases
description: The released test cases of HEARTS, a benchmark of LLM reasoning over health time series.
  The tasks ask about glucose, respiration, oxygen saturation, heart rate, cough, breathing, and speech
  recordings from five upstream corpora, and one task adds meal photographs. Every task is a test item.
  A forecast or imputation answer is held in a record of its own.
