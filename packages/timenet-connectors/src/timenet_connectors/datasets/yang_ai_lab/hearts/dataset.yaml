# yaml-language-server: $schema=https://docs.timenet.ai/schemas/dataset-card-v1.schema.json
# Dataset Card for the yang-ai-lab/hearts connector: the single source for this dataset's metadata.
# The connector loads it via DatasetMetadata.from_yaml(); the builder compiles it plus the schema
# derived from the data into manifest.json.
#
# Scope: 21 of the 30 released task directories. The other 9 hold meal photographs, cases with no
# series at all, or an answer that is itself a run of held-out values. The README lists each one.
#
# Licence: the release declares none at any source, and part of it derives from a NonCommercial
# corpus, so the card says `other` and the README says what that means.
yaml_schema_version: 1
dataset_id: yang-ai-lab/hearts
dataset_version: 1.0.0
name: HEARTS frozen test cases
description: >-
  The released test cases of a health time-series agent benchmark. One record is one case: the
  signals the reference harness hands its agent, plus the question and its ground-truth answer.
  The release redistributes five upstream corpora, so a record carries interstitial glucose,
  respiration, oxygen saturation, heart rate, or an audio waveform.
license: other
license_url: https://huggingface.co/datasets/yang-ai-lab/HEARTS
domains:
  - health
  - respiratory
  - audio
  - cardiology
tags:
  - benchmark
  - qa
  - reasoning
  - glucose
  - respiration
  - spo2
  - audio
  - cough
  - speech
source_url: https://huggingface.co/datasets/yang-ai-lab/HEARTS
citation: >-
  Li, Xiao, Joshi, Metwally, McDuff, Wang, Yang. HEARTS: Benchmarking LLM Reasoning on Health Time
  Series. arXiv:2603.06638.
