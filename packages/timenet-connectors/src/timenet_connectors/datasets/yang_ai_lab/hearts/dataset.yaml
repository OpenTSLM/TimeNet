# yaml-language-server: $schema=https://docs.timenet.ai/schemas/dataset-card-v2.schema.json
# Dataset card for the yang-ai-lab/hearts connector: the single source for this dataset's metadata.
# The connector loads it via DatasetMetadata.from_yaml(); the builder compiles it plus the schema
# derived from the data into manifest.json.
#
# The Hub release declares no license, and its cases derive from five upstream corpora (CGMacros,
# HARESPOD, Coswara, COUGHVID, VCTK) with licenses of their own, so the card says `other`.
yaml_schema_version: 2
dataset_id: yang-ai-lab/hearts
dataset_version: 1.0.0
source_revision: 7c18df521ae36cbc6b61e17782f1ac08dc378ea1
