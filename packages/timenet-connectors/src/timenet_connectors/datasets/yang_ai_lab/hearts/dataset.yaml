name: HEARTS
description: >-
  The combined HEARTS benchmark. Five independently buildable benchmark children select and
  transform original CGMacros, Coswara, COUGHVID, HARESPOD, and VCTK recordings. This aggregate
  imports their records and tasks without new waveform copies or external downloads. All tasks
  retain the published test split, prompts, labels, and case identifiers.
