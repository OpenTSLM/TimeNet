description: >-
  HEARTS altitude-ranking and signal-pairing tasks derived from complete HARESPOD recordings.
  Ranking windows select exact source timestamps. Pairing windows reset their clocks, so the
  connector requires a unique matching source window and verifies its sampling clock. The child
  owns these windows and the benchmark labels; the parent retains the complete recordings.
