name: HEARTS VCTK
description: >-
  HEARTS temporal-direction detection over child-owned VCTK recordings. The child selects the
  original microphone using a verified mapping for the pinned benchmark, then
  resamples to 16 kHz with soxr HQ and reverses the selected cases. It verifies the resulting
  waveform against the pinned benchmark within float32 rounding tolerance. The parent retains
  both microphones at their native rates and orientations.
