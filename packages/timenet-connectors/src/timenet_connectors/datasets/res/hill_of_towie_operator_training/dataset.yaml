yaml_schema_version: 1
dataset_id: res/hill-of-towie-operator-training
dataset_version: 1.0.0
name: Hill of Towie Operator-Response Training
description: >-
  The selected train, validation, and held-out examples for the audited Hill of Towie
  operator-response run, whose update-1500 checkpoint is recorded in hackathon commit f6e6450.
  Six-hour and seven-day windows of ten-minute SCADA readings support operator response,
  classification, and caption tasks. The release preserves the 9,709 training, 172 validation,
  and 371 test examples, including their channel order, missing readings, and text targets.
license: CC-BY-4.0
