# yaml-language-server: $schema=https://docs.timenet.ai/schemas/dataset-card-v1.schema.json
yaml_schema_version: 1
dataset_id: res/hill-of-towie-scada
dataset_version: 1.0.0
name: Hill of Towie SCADA
description: >-
  Ten-minute SCADA means for the Hill of Towie wind farm from January through April 2026.
  Forecast six active-power readings from the preceding 36 readings of active power, active
  wind speed, and generator speed. Forecasts start at hourly UTC cutoffs. Each example uses one
  turbine and one source month and excludes windows with missing required readings. Timestamps
  label the end of each ten-minute measurement interval. January and February are for training,
  March for validation, and April for testing. This subset uses the 2026 SCADA archive and static
  turbine metadata from source release 2.1.0.
license: CC-BY-4.0
access: open
source_url: https://zenodo.org/records/22662930
citation: >-
  Clerc, A., and Lingkan, E. (2026). Hill of Towie wind farm open dataset (Version 2.1.0).
  Zenodo. https://doi.org/10.5281/zenodo.22662930. Released by RES on behalf of TRIG.
domains:
