[project]
name = "timenet"
version = "0.1.0"
description = "TimeNet is infrastructure for registering, querying, downloading, converting, and exploring time series datasets in a shared TimeF format."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "The TimeNet authors" }]
keywords = ["time-series", "datasets", "timef", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28",
    "jaxtyping>=0.3",
    "numpy>=2.1",
    "pint>=0.25",
    "pyarrow>=21",
    "duckdb>=1.1",
    "pydantic-settings>=2.4",
]

[project.urls]
Homepage = "https://timenet.ai"
Documentation = "https://docs.timenet.ai/"
Repository = "https://github.com/OpenTSLM/TimeNet"
Issues = "https://github.com/OpenTSLM/TimeNet/issues"

[project.optional-dependencies]
# Optional PyTorch loader (timenet.torch / load_torch). Build-agnostic: any torch build (CPU, CUDA,
# ROCm, MPS) satisfies it, so a user with an existing CUDA torch reuses it and nothing is downgraded.
# For a small CPU-only torch, install it from the CPU index first:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
# The S3 registry backend (store/download against an s3:// bucket). boto3 is imported lazily and raises a
# clear "install timenet[s3]" message when the extra is absent; pyarrow (already a core dep) supplies the
# S3FileSystem for lazy range reads.
s3 = [
    "boto3>=1.34",
]
all = [
    "timenet[s3]",
]

[tool.uv.sources]
# uv-only (never in published metadata): pin this repo's own dev/CI torch to the small CPU build.
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"
