[project]
name = "timenet"
version = "0.1.0"
description = "TimeNet is infrastructure for registering, querying, downloading, converting, and exploring time series datasets in a shared TimeF format."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",
    "pint>=0.25",
    "pyarrow>=21",
    "pydantic-settings>=2.4",
    "rich>=13",
    "typer>=0.12",
]

[project.scripts]
timenet = "timenet.cli:main"

[project.optional-dependencies]
torch = [
    "torch>=2.2",
]

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"
