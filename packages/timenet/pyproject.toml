[project]
name = "timenet"
version = "0.1.0"
description = "TimeNet is infrastructure for registering, querying, downloading, converting, and exploring time series datasets in a shared TimeF format."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fsspec[http]>=2024.6.0",
    "httpx>=0.28",
    "jaxtyping>=0.3",
    "numpy>=2.1",
    "pint>=0.25",
    "pyarrow>=21",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
# The console CLI (`timenet`) needs Typer + Rich; the SDK and TimeF format do not. `timenet.cli:main`
# degrades with a clear "install timenet[cli]" message when this extra is absent.
cli = [
    "typer>=0.12",
    "rich>=13",
]
# Optional PyTorch loader (timenet.torch / load_torch). Build-agnostic: any torch build (CPU, CUDA,
# ROCm, MPS) satisfies it, so a user with an existing CUDA torch reuses it and nothing is downgraded.
# For a small CPU-only torch, install it from the CPU index first:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
torch = [
    "torch>=2.2",
]
# Building a dataset loads and validates its human-authored card YAML against the packaged JSON Schema,
# and runs the connector in an environment built from its own requirements. The PyPI `uv` package ships
# the binary, so nobody installs uv by hand and the build path locates it without relying on PATH.
build = [
    "pyyaml>=6",
    "jsonschema>=4.18",
    "uv>=0.10.10",
]
# The Zarr values backend (an alternative to the default Parquet shard store). The core reader/writer
# never import zarr; `timenet.writer.zarr_values` imports it lazily and raises a clear
# "install timenet[zarr]" message when the extra is absent.
zarr = [
    "zarr>=3",
]
# The S3 registry backend (store/download against an s3:// bucket). boto3 is imported lazily and raises a
# clear "install timenet[s3]" message when the extra is absent; pyarrow (already a core dep) supplies the
# S3FileSystem for lazy range reads.
s3 = [
    "boto3>=1.34",
]
all = [
    "timenet[cli,torch,build,zarr,s3]",
]

[project.scripts]
timenet = "timenet.cli:main"

[tool.uv.sources]
# uv-only (never in published metadata): pin this repo's own dev/CI torch to the small CPU build.
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"
