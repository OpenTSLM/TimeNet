[project]
name = "timenet"
version = "0.1.0"
description = "TimeNet is infrastructure for registering, querying, downloading, converting, and exploring time series datasets in a shared TimeF format."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1",
    "pint>=0.25",
    "pyarrow>=21",
    "pydantic-settings>=2.4",
]

[project.scripts]
timenet = "timenet.cli:main"

[project.optional-dependencies]
# The console CLI (`timenet`) needs Typer + Rich; the SDK and TimeF format do not. `timenet.cli:main`
# degrades with a clear "install timenet[cli]" message when this extra is absent.
cli = [
    "typer>=0.12",
    "rich>=13",
]
torch = [
    "torch>=2.2",
]
# Curating a dataset loads and validates its human-authored card YAML against the packaged JSON Schema.
# The lean consumer core (reading manifests) needs neither dep; `DatasetMetadata.from_yaml` imports them
# lazily and raises a clear "install timenet[curation]" message when this extra is absent.
curation = [
    "pyyaml>=6",
    "jsonschema>=4.18",
]
all = [
    "timenet[cli,torch,curation]",
]

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"
