[project]
name = "timenet"
version = "0.1.0"
description = "TimeNet is infrastructure for registering, querying, downloading, converting, and exploring time series datasets in a shared TimeF format."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",
    "pint>=0.25",
    "pyarrow>=21",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
# PyYAML and jsonschema are only needed to author or read dataset cards. DatasetMetadata.from_yaml
# imports them lazily and raises a clear "install timenet[curation]" message when this extra is absent.
curation = [
    "pyyaml>=6",
    "jsonschema>=4.18",
]
# The console CLI (`timenet`) needs Typer + Rich; the SDK and TimeF format do not. `timenet.cli:main`
# degrades with a clear "install timenet[cli]" message when this extra is absent.
cli = [
    "typer>=0.12",
    "rich>=13",
]
torch = [
    "torch>=2.2",
]
all = [
    "timenet[cli,curation,torch]",
]

[project.scripts]
timenet = "timenet.cli:main"

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"
