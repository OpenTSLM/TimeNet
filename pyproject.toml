[project]
name = "timenet"
version = "0.1.0"
description = "TimeNet is infrastructure for registering, querying, downloading, converting, and exploring time series datasets in a shared TimeF format."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
timenet = "timenet.cli:main"

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = ["SIM", "C4", "PIE", "RET", "PTH", "ARG", "ASYNC", "UP", "RUF", "E", "N", "W", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["timenet"]

[tool.ty.environment]
python-version = "3.13"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "ty>=0.0.34",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[tool.uv]
default-groups = ["dev"]
