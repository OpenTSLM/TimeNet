[tool.uv.workspace]
members = ["packages/*"]

[tool.uv]
default-groups = ["dev"]
required-version = ">=0.10.10"

[dependency-groups]
# Optional runtime deps (torch, typer/rich, huggingface-hub) are NOT duplicated here: they come from the
# packages' extras, installed for dev/test/CI via `uv sync --all-groups --all-extras` (see `make sync`).
dev = [
    "hypothesis>=6.140",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "ty>=0.0.34",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[tool.ruff]
line-length = 120
target-version = "py311"
# Members live under packages/*/src; the glob makes isort treat each package as
# first-party. Config is discovered from the repo root, not shared by uv.
src = ["packages/*/src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
# Required for the DOC (pydoclint) rules, which are still in preview.
preview = true
select = [
    "SIM",    # flake8-simplify — simplify needlessly verbose code
    "C4",     # flake8-comprehensions — better list/set/dict comprehensions
    "PIE",    # flake8-pie — misc lints (unnecessary pass, dup class fields)
    "RET",    # flake8-return — consistent return statements
    "PTH",    # flake8-use-pathlib — prefer pathlib over os.path
    "ARG",    # flake8-unused-arguments — flag unused function arguments
    "ASYNC",  # flake8-async — async/await pitfalls
    "UP",     # pyupgrade — modern Python syntax
    "RUF",    # Ruff-specific rules
    "E",      # pycodestyle errors
    "N",      # pep8-naming — naming conventions
    "W",      # pycodestyle warnings
    "F",      # Pyflakes — undefined names, unused imports
    "I",      # isort — import sorting
    "B",      # flake8-bugbear — likely bugs and design problems
    "S",      # flake8-bandit — security issues
    "D",      # pydocstyle — docstring presence and formatting
    "DOC",    # pydoclint — args/returns match signatures
]
ignore = [
    "E501",  # Line too long — handled by the formatter
    "D417",  # Don't require documentation for every function parameter
    "D105",  # Missing docstring in magic method
    "D107",  # Missing docstring in __init__
]

[tool.ruff.lint.per-file-ignores]
# Pytest uses bare asserts by design; token-like literals in tests are fixtures.
# Don't require docstrings for test modules and functions. Pickle round-trips are intentional
# (they prove serializability), and we deserialize only our own freshly-pickled objects.
"**/tests/**/*.py" = ["S101", "S106", "D", "DOC", "S301", "S403", "S404", "S603", "ARG"]
# timenet.testing is a test-support subpackage; assert-based comparison helpers are its purpose.
"**/src/timenet/testing/*.py" = ["S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
# Typer expects Option/Argument descriptors as parameter defaults.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
lines-after-imports = 2

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--strict-markers"]
testpaths = ["packages"]
markers = [
    "slow: full-disk round-trip and property tests (deselect with '-m \"not slow\"')",
]

[tool.ty.environment]
python-version = "3.11"
