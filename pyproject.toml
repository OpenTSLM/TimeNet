[project]
name = "timenet"
version = "0.1.0"
description = "TimeNet is infrastructure for registering, querying, downloading, converting, and exploring time series datasets in a shared TimeF format."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
timenet = "timenet.cli:main"

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
# Required for the DOC (pydoclint) rules, which are still in preview.
preview = true
select = [
    "SIM",    # flake8-simplify — simplify needlessly verbose code
    "C4",     # flake8-comprehensions — better list/set/dict comprehensions
    "PIE",    # flake8-pie — misc lints (unnecessary pass, dup class fields)
    "RET",    # flake8-return — consistent return statements
    "PTH",    # flake8-use-pathlib — prefer pathlib over os.path
    "ARG",    # flake8-unused-arguments — flag unused function arguments
    "ASYNC",  # flake8-async — async/await pitfalls
    "UP",     # pyupgrade — modern Python syntax
    "RUF",    # Ruff-specific rules
    "E",      # pycodestyle errors
    "N",      # pep8-naming — naming conventions
    "W",      # pycodestyle warnings
    "F",      # Pyflakes — undefined names, unused imports
    "I",      # isort — import sorting
    "B",      # flake8-bugbear — likely bugs and design problems
    "S",      # flake8-bandit — security issues
    "D",      # pydocstyle — docstring presence and formatting
    "DOC",    # pydoclint — args/returns match signatures
]
ignore = [
    "E501",  # Line too long — handled by the formatter
    "D417",  # Don't require documentation for every function parameter
    "D105",  # Missing docstring in magic method
    "D107",  # Missing docstring in __init__
]

[tool.ruff.lint.per-file-ignores]
# Pytest uses bare asserts by design; token-like literals in tests are fixtures.
# Don't require docstrings for test modules and functions.
"tests/**/*.py" = ["S101", "S106", "D", "DOC"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["timenet"]
combine-as-imports = true
force-sort-within-sections = true
lines-after-imports = 2

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.13"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "ty>=0.0.34",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[tool.uv]
default-groups = ["dev"]
