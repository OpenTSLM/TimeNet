name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      target:
        description: Index to publish to
        required: true
        default: TestPyPI
        type: choice
        options:
          - TestPyPI
          - PyPI
      package:
        description: Package(s) to publish
        required: true
        default: both
        type: choice
        options:
          - both
          - timenet
          - timenet-connectors
      ref:
        description: Release tag to build, for example timenet-v0.12.0. Leave empty to build the branch above.
        required: false
        type: string

run-name: Publish ${{ inputs.package }} ${{ inputs.ref }} to ${{ inputs.target }}

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    # The `pypi` environment gates every run behind its required reviewers, so a publish only
    # proceeds once one of the listed admins approves it, even though workflow_dispatch is offered
    # to anyone with write access. Configure the reviewers in Settings > Environments > pypi.
    environment:
      name: pypi
    permissions:
      # Mint the OIDC token uv exchanges for a PyPI/TestPyPI trusted-publishing token. No API
      # tokens are stored as repo secrets.
      id-token: write
      contents: read
    steps:
      - name: Guard PyPI to main
        run: |
          echo "Branch: $BRANCH_NAME"
          if [ "${{ inputs.target }}" = "PyPI" ] && [ "$BRANCH_NAME" != "main" ]; then
            echo "::error title=Invalid branch::PyPI releases must come from main."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # A tag, or the exact commit the run was started on, not the branch tip at approval time.
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Guard the release tag
        if: inputs.ref != ''
        env:
          REF: ${{ inputs.ref }}
        run: |
          if ! [[ "$REF" =~ ^(timenet|timenet-connectors)-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error title=Invalid ref::Build only a <package>-vX.Y.Z tag on main, not '$REF'."
            exit 1
          fi
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
      - name: Guard the release versions
        env:
          REF: ${{ inputs.ref }}
          TARGET: ${{ inputs.target }}
          PACKAGE: ${{ inputs.package }}
        run: |
          if [ -z "$REF" ]; then
            if [ "$TARGET" = PyPI ]; then
              echo "::error title=No release tag::Publish to PyPI from a <package>-vX.Y.Z tag. Set the ref input."
              exit 1
            fi
            exit 0
          fi
          if [ "$PACKAGE" = both ]; then packages="timenet timenet-connectors"; else packages=$PACKAGE; fi
          for package in $packages; do
            version=$(uv version --package "$package" --short)
            tag="$package-v$version"
            if [ "$(git rev-parse -q --verify "refs/tags/$tag^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "::error title=Not released::$package is at $version, but $tag does not point at this commit. Release it first."
              exit 1
            fi
          done
      - name: Build
        # build_dists.py records the commit inside each package, so a build can name its code.
        run: |
          if [ "${{ inputs.package }}" = "both" ]; then
            uv run scripts/build_dists.py --all-packages
          else
            uv run scripts/build_dists.py --package "${{ inputs.package }}"
          fi
      - name: Smoke test built artifacts
        # Import each built wheel and sdist in an isolated environment to catch missing files or
        # broken metadata before uploading. Each artifact must also report this commit, clean, as
        # the code it was built from. timenet-connectors depends on timenet, so hand it the
        # wheel we just built when it is present (a `both` run); otherwise timenet resolves from the
        # default index, which requires it to be published already.
        run: |
          set -euo pipefail
          shopt -s nullglob
          timenet_whl=(dist/timenet-*.whl)
          # The checked-out commit: the release tag's commit, or GITHUB_SHA without a ref.
          expected_sha=$(git rev-parse HEAD)
          smoke() {
            local module="$1" dist="$2"; shift 2
            local args=() artifact
            for artifact in "$@"; do args+=(--with "$artifact"); done
            echo "::group::import $module"
            uv run --isolated --no-project "${args[@]}" \
              python -c "import $module; print('smoke ok:', $module.__name__)"
            uv run --isolated --no-project "${args[@]}" python -c "
          from timenet.manifest import GitSource
          from timenet.provenance import PackageSnapshot
          commit = PackageSnapshot.read('$dist').source
          expected = GitSource(sha='$expected_sha', contains_local_changes=False)
          assert commit == expected, f'$dist records {commit}, expected {expected}'
          print('commit ok:', commit)"
            echo "::endgroup::"
          }
          for artifact in dist/*; do
            case "$artifact" in
              dist/timenet-*.whl | dist/timenet-*.tar.gz)
                smoke timenet timenet "$artifact" ;;
              dist/timenet_connectors-*.whl | dist/timenet_connectors-*.tar.gz)
                smoke timenet_connectors timenet-connectors ${timenet_whl[@]+"${timenet_whl[@]}"} "$artifact" ;;
            esac
          done
      - name: Publish
        run: |
          if [ "${{ inputs.target }}" = "TestPyPI" ]; then
            uv publish --publish-url https://test.pypi.org/legacy/
          else
            uv publish
          fi
      - name: Summary
        if: success()
        run: |
          host=pypi.org
          if [ "${{ inputs.target }}" = "TestPyPI" ]; then host=test.pypi.org; fi
          {
            echo "### Published to ${{ inputs.target }} :rocket:"
            echo
            for whl in dist/*.whl; do
              base=$(basename "$whl")
              dist_name=${base%%-*}
              rest=${base#*-}
              version=${rest%%-*}
              project=${dist_name//_/-}
              echo "- \`$project\` $version — https://$host/project/$project/$version/"
            done
          } >> "$GITHUB_STEP_SUMMARY"
