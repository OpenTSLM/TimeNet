name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      target:
        description: Index to publish to
        required: true
        default: TestPyPI
        type: choice
        options:
          - TestPyPI
          - PyPI

run-name: Publish timenet to ${{ inputs.target }}

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    # The `pypi` environment gates every run behind its required reviewers, so a publish only
    # proceeds once one of the listed admins approves it, even though workflow_dispatch is offered
    # to anyone with write access. Configure the reviewers in Settings > Environments > pypi.
    environment:
      name: pypi
    permissions:
      # Mint the OIDC token uv exchanges for a PyPI/TestPyPI trusted-publishing token. No API
      # tokens are stored as repo secrets.
      id-token: write
      contents: read
    steps:
      - name: Guard PyPI to main
        run: |
          echo "Branch: $BRANCH_NAME"
          if [ "${{ inputs.target }}" = "PyPI" ] && [ "$BRANCH_NAME" != "main" ]; then
            echo "::error title=Invalid branch::PyPI releases must come from main."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
      - name: Build
        run: uv build --package timenet
      - name: Smoke test built artifacts
        # Import the built wheel and sdist in an isolated environment to catch missing files or
        # broken metadata before uploading.
        run: |
          set -euo pipefail
          shopt -s nullglob
          for artifact in dist/timenet-*.whl dist/timenet-*.tar.gz; do
            echo "::group::import timenet from $artifact"
            uv run --isolated --no-project --with "$artifact" \
              python -c "import timenet; print('smoke ok:', timenet.__name__)"
            echo "::endgroup::"
          done
      - name: Publish
        run: |
          if [ "${{ inputs.target }}" = "TestPyPI" ]; then
            uv publish --publish-url https://test.pypi.org/legacy/
          else
            uv publish
          fi
      - name: Summary
        if: success()
        run: |
          host=pypi.org
          if [ "${{ inputs.target }}" = "TestPyPI" ]; then host=test.pypi.org; fi
          {
            echo "### Published to ${{ inputs.target }} :rocket:"
            echo
            for whl in dist/*.whl; do
              base=$(basename "$whl")
              dist_name=${base%%-*}
              rest=${base#*-}
              version=${rest%%-*}
              project=${dist_name//_/-}
              echo "- \`$project\` $version — https://$host/project/$project/$version/"
            done
          } >> "$GITHUB_STEP_SUMMARY"
