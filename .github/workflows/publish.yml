name: Publish to PyPI

# Uploads the wheel and the sdist that release.yml built and attached to the GitHub release of a
# <package>-vX.Y.Z tag. It does not build. release.yml starts the TestPyPI run, and a successful
# TestPyPI run starts the PyPI run of the same tag.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Index to publish to
        required: true
        default: TestPyPI
        type: choice
        options:
          - TestPyPI
          - PyPI
      package:
        description: Package(s) to publish
        required: true
        default: both
        type: choice
        options:
          - both
          - timenet
          - timenet-connectors
      ref:
        description: Release tag to publish, for example timenet-v0.12.0
        required: true
        type: string

run-name: Publish ${{ inputs.package }} ${{ inputs.ref }} to ${{ inputs.target }}

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    # The `pypi` environment gates every run behind its required reviewers, so a publish only
    # proceeds once one of the listed admins approves it, even though workflow_dispatch is offered
    # to anyone with write access. Configure the reviewers in Settings > Environments > pypi.
    environment:
      name: pypi
    permissions:
      # Mint the OIDC token uv exchanges for a PyPI/TestPyPI trusted-publishing token. No API
      # tokens are stored as repo secrets.
      id-token: write
      contents: read
      # Start the PyPI run after a TestPyPI run.
      actions: write
    steps:
      - name: Guard to main
        run: |
          echo "Branch: $BRANCH_NAME"
          if [ "$BRANCH_NAME" != "main" ]; then
            echo "::error title=Invalid branch::Run publish.yml from main."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Guard the release tag
        env:
          REF: ${{ inputs.ref }}
        run: |
          if ! [[ "$REF" =~ ^(timenet|timenet-connectors)-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error title=Invalid ref::Publish only a <package>-vX.Y.Z tag on main, not '$REF'."
            exit 1
          fi
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
      - name: Download the release files
        # Each published package needs its own tag on this commit, and the files its GitHub
        # release holds: one wheel and one sdist at the tagged version, nothing else.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGE: ${{ inputs.package }}
        run: |
          if [ "$PACKAGE" = both ]; then packages="timenet timenet-connectors"; else packages=$PACKAGE; fi
          expected=()
          for package in $packages; do
            version=$(uv version --package "$package" --short)
            tag="$package-v$version"
            if [ "$(git rev-parse -q --verify "refs/tags/$tag^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "::error title=Not released::$package is at $version, but $tag does not point at this commit. Release it first."
              exit 1
            fi
            gh release download "$tag" --dir dist
            expected+=("${package//-/_}-$version-py3-none-any.whl" "${package//-/_}-$version.tar.gz")
          done
          if [ "$(ls dist | sort)" != "$(printf '%s\n' "${expected[@]}" | sort)" ]; then
            echo "::error title=Unexpected files::The releases hold $(ls dist | xargs), expected ${expected[*]}."
            exit 1
          fi
          ls -l dist
      - name: Publish
        run: |
          if [ "${{ inputs.target }}" = "TestPyPI" ]; then
            uv publish --publish-url https://test.pypi.org/legacy/ dist/*
          else
            uv publish dist/*
          fi
      - name: Start the PyPI run
        # A TestPyPI run starts the PyPI run of the same tag, which waits for approval. So PyPI
        # can only be approved after TestPyPI took the same files.
        if: inputs.target == 'TestPyPI'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGE: ${{ inputs.package }}
          REF: ${{ inputs.ref }}
        run: |
          name="Publish $PACKAGE $REF to PyPI"
          if gh run list --workflow publish.yml --event workflow_dispatch --limit 100 --json displayTitle \
              --jq '.[].displayTitle' | grep -qxF "$name"; then
            echo "Skipping '$name': it was already started."
            exit 0
          fi
          gh workflow run publish.yml --ref main -f target=PyPI -f package="$PACKAGE" -f ref="$REF"
      - name: Summary
        if: success()
        run: |
          host=pypi.org
          if [ "${{ inputs.target }}" = "TestPyPI" ]; then host=test.pypi.org; fi
          {
            echo "### Published to ${{ inputs.target }} :rocket:"
            echo
            for whl in dist/*.whl; do
              base=$(basename "$whl")
              dist_name=${base%%-*}
              rest=${base#*-}
              version=${rest%%-*}
              project=${dist_name//_/-}
              echo "- \`$project\` $version — https://$host/project/$project/$version/"
            done
          } >> "$GITHUB_STEP_SUMMARY"
