name: Deploy docs

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, skipping runs queued between an in-progress run and the latest.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: "3.13"
    - name: Install docs dependencies
      run: uv sync --group docs --extra build
    - name: Generate dataset pages
      run: uv run --group docs --extra build python scripts/gen_dataset_docs.py
    - name: Generate API reference pages
      run: uv run --group docs python scripts/gen_api_docs.py
    - name: Build site
      run: uv run zensical build --strict
    - name: Enhance site (markdown mirrors, llms.txt, social meta, JSON-LD)
      run: uv run --group docs --extra build python scripts/gen_site_extras.py
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
