name: PR-Agent review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  pr_agent:
    # Skip bots and draft PRs. Comment commands (/review, /improve, ...) work on any PR.
    if: ${{ github.event.sender.type != 'Bot' && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
    - name: Run PR-Agent
      uses: The-PR-Agent/pr-agent@v0.50.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        OPENROUTER.KEY: ${{ secrets.OPENROUTER_API_KEY }}
        # Kimi on Nebius (BYOK). LiteLLM does not know this id, so the context window is set
        # explicitly.
        CONFIG.MODEL: openrouter/moonshotai/kimi-k3.1-pro
        CONFIG.FALLBACK_MODELS: '[]'
        CONFIG.CUSTOM_MODEL_MAX_TOKENS: 128000
        CONFIG.MAX_MODEL_TOKENS: 120000
        OPENROUTER.PROVIDER_ONLY: '["nebius"]'
        OPENROUTER.ALLOW_FALLBACKS: "false"
        # Split reviews that do not fit one call into chunks.
        PR_REVIEWER.ENABLE_LARGE_PR_CHUNKING: "true"
        PR_REVIEWER.MAX_NUMBER_OF_CALLS: 6
        # Review summary plus inline code suggestions. Run /describe in a PR comment when wanted.
        github_action_config.auto_review: "true"
        github_action_config.auto_describe: "false"
        github_action_config.auto_improve: "true"
        # Never set labels on the PR.
        PR_REVIEWER.ENABLE_REVIEW_LABELS_SECURITY: "false"
        PR_REVIEWER.ENABLE_REVIEW_LABELS_EFFORT: "false"
        PR_DESCRIPTION.PUBLISH_LABELS: "false"
        # Post each suggestion as an inline comment with an "Apply suggestion" button.
        PR_CODE_SUGGESTIONS.COMMITTABLE_CODE_SUGGESTIONS: "true"
        PR_CODE_SUGGESTIONS.PERSISTENT_COMMENT: "false"
        # Pull TimeNet's AGENTS.md rules into the review.
        PR_REVIEWER.EXTRA_INSTRUCTIONS: >-
          Follow AGENTS.md. Check TimeF invariants, explicit TimeNet exceptions on data issues
          (no silent repair of data), data types, missing values, lazy loading and bounded memory.
          For stacked PRs, report defects only when they are material.
