name: Pre-commit hooks

on:
  pull_request:
    # ready_for_review is what starts the full suites once a draft is promoted. Without it, marking
    # a pull request ready would leave the tiers below unrun and the gate red.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# github.ref is refs/pull/<n>/merge here: unique per pull request, stable across pushes. Cancelling
# is scoped to pull_request so a run triggered by anything else is never superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Everything a developer can act on in the first minute. Runs on every push, drafts included.
  quick:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Set up uv
      uses: astral-sh/setup-uv@v8.2.0
      with:
        # Storing the uv cache is a net loss here. `uv cache prune --ci` strips it to 1 MB, because
        # every dependency resolves to a pre-built wheel and that is exactly what --ci drops. Kept
        # unpruned it is ~870 MB, and restoring that costs more than the cold sync it saves.
        enable-cache: false
    - name: Restore the pre-commit cache
      # Restore-only on purpose. warm-cache.yaml is the single writer, on main, so every pull
      # request reads one shared entry instead of each writing its own and evicting the others. The
      # prefix key turns a hook bump into a partial hit rather than a full rebuild.
      uses: actions/cache/restore@v5
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
        restore-keys: pre-commit-${{ runner.os }}-
    - name: Install dependencies
      run: make sync
    - name: Lint, format and types
      id: checks
      continue-on-error: true
      run: make check-ci
    - name: Restore the working tree
      # Undo pre-commit's in-place fixes so pytest sees the PR's source. Never `git clean` (venv).
      run: git checkout -- .
    - name: Unit tests
      id: unit
      continue-on-error: true
      run: make test-unit
    # Both steps above run to completion even when one fails, so the report lists every outcome
    # instead of stopping at the first.
    - name: Fail if a quick check failed
      if: steps.checks.outcome == 'failure' || steps.unit.outcome == 'failure'
      run: exit 1

  # Skipped on drafts. A Free plan allows 20 concurrent jobs, and the 12-deep stacks this repo
  # pushes would otherwise ask for 36 at once and queue the quick job behind a full suite.
  tests:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Set up uv
      uses: astral-sh/setup-uv@v8.2.0
      with:
        enable-cache: false
    - name: Install dependencies
      run: make sync
    - name: Test with pytest (Python 3.13)
      id: pytest
      continue-on-error: true
      run: make test
    - name: Test connectors in per-connector environments
      # Each connector's tests and type-check run in an environment built from its own
      # requirements.txt, the same way a build runs.
      id: connectors
      continue-on-error: true
      run: make test-connectors
    - name: Check dependency licenses
      id: license
      continue-on-error: true
      run: make license-check
    - name: Fail if any check failed
      if: >-
        steps.pytest.outcome == 'failure'
        || steps.connectors.outcome == 'failure'
        || steps.license.outcome == 'failure'
      run: exit 1

  # Guards the minimum supported Python. Its own job, so it builds a 3.11 environment once instead
  # of tearing down the 3.13 one mid-run.
  tests_min:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    env:
      # Threads the interpreter through `make sync` and `make test`.
      UV_PYTHON: "3.11"
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Set up uv
      uses: astral-sh/setup-uv@v8.2.0
      with:
        enable-cache: false
    - name: Install dependencies
      run: make sync
    - name: Test with pytest (Python 3.11)
      run: make test

  # The ruleset on main requires one status check context named exactly `check`, and a check run
  # takes its name from the job id. Do not add a `name:` here and do not turn this into a matrix:
  # either one renames the context, after which nothing can satisfy the gate.
  check:
    needs: [quick, tests, tests_min]
    # always(), not !cancelled(): a job skipped by an `if` reports `skipped`, and a skipped required
    # check counts as a pass. This job has to run and decide for itself.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Set up uv
      uses: astral-sh/setup-uv@v8.2.0
      with:
        enable-cache: false
    - name: Report
      # Skipped on forks, whose token has no pull-requests: write, and on drafts, where two of the
      # three tiers did not run. A transient comment-API error must never decide the verdict, hence
      # continue-on-error; the step below is the verdict.
      if: >-
        !cancelled()
        && !github.event.pull_request.draft
        && github.event.pull_request.head.repo.full_name == github.repository
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        QUICK: ${{ needs.quick.result }}
        TESTS: ${{ needs.tests.result }}
        TESTS_MIN: ${{ needs.tests_min.result }}
      run: uv run --no-project .github/scripts/ci_report.py
    - name: Verdict
      env:
        DRAFT: ${{ github.event.pull_request.draft }}
        RESULTS: >-
          ${{ needs.quick.result }}
          ${{ needs.tests.result }}
          ${{ needs.tests_min.result }}
      run: |
        if [ "$DRAFT" = "true" ]; then
          echo "Draft pull request: the 3.13 and 3.11 suites did not run."
          echo "Mark it ready for review to run them."
          exit 1
        fi
        for result in $RESULTS; do
          if [ "$result" != "success" ]; then
            echo "A required tier reported '$result'."
            exit 1
          fi
        done
        echo "All tiers passed."
