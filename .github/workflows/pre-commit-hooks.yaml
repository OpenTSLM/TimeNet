name: Pre-commit hooks

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

# Cancel a superseded run so two runs can't race to rewrite the sticky comment.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  UV_SYNC_ARGS: --all-groups --all-extras

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Set up uv
      uses: astral-sh/setup-uv@v8.2.0
      with:
        enable-cache: true
        prune-cache: false
        cache-suffix: py313
    - name: Cache pre-commit environments
      uses: actions/cache@v5
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
    - name: Install dependencies
      run: uv sync $UV_SYNC_ARGS
    # The three checks below run to completion even when one fails, so the report lists every
    # outcome instead of stopping at the first. The final step decides the job's verdict.
    - name: Run pre-commit hooks
      id: precommit
      continue-on-error: true
      run: |
        uv run pre-commit run \
          --from-ref origin/${{ github.base_ref }} \
          --to-ref ${{ github.sha }} \
          --show-diff-on-failure
    - name: Restore the working tree
      # Undo pre-commit's in-place fixes so pytest sees the PR's source. Never `git clean` (venv).
      run: git checkout -- .
    - name: Test with pytest (Python 3.13)
      id: pytest
      continue-on-error: true
      run: uv run pytest
    - name: Test with pytest (Python 3.11)
      # Guard the minimum supported Python; the steps above run on 3.13. Re-syncs the venv, so it
      # has to come after the 3.13 run.
      #
      # This re-downloads the cp311 wheels on every run (~350 MB). The uv cache is keyed py313 and
      # setup-uv skips saving on a key hit, so the cp311 wheels can never persist. Splitting 3.11
      # into its own job with cache-suffix: py311 would fix it, at the cost of the single-job report
      # below losing its per-step granularity. Accepted deliberately: keep the one job.
      id: pytestmin
      continue-on-error: true
      run: uv sync $UV_SYNC_ARGS --python 3.11 && uv run --python 3.11 pytest
    - name: Report
      # Skipped on forks, whose token has no pull-requests: write. A transient comment-API error
      # must never turn a passing run red, hence continue-on-error; the verdict is the step below.
      if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
        PRECOMMIT: ${{ steps.precommit.outcome }}
        PYTEST: ${{ steps.pytest.outcome }}
        PYTEST_MIN: ${{ steps.pytestmin.outcome }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: uv run .github/scripts/ci_report.py
    - name: Fail if any check failed
      if: steps.precommit.outcome == 'failure' || steps.pytest.outcome == 'failure' || steps.pytestmin.outcome == 'failure'
      run: exit 1
