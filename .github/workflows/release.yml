name: Release

# Releases both packages in lockstep, in three steps:
#   1. Run this workflow on main. It opens a release PR that sets the version and shows the notes.
#   2. Merge the release PR. This tags vX.Y.Z, creates the GitHub release, starts a TestPyPI and
#      a PyPI run of publish.yml for the tag (each waits for approval in the pypi environment), and
#      opens a PR that moves main to the next development version, X.(Y+1).0.dev0.
#   3. Approve the TestPyPI run and check the result, approve the PyPI run, then merge the
#      development-version PR.
# The version is fixed when the release PR opens. If main gets changes that need a bigger bump
# before you merge it, close the release PR and run this workflow again.
# Every job can be re-run: steps that already happened are skipped.
# Only admins and maintainers can start a release, merge the release PR, or re-run a job. If
# someone else merges the release PR, nothing is tagged until an admin or maintainer re-runs it.
#
# Needs a GitHub App with contents and pull-requests write access, installed on this repository,
# with its id in the RELEASE_APP_ID variable and its key in the RELEASE_APP_PRIVATE_KEY secret.
# PRs opened with GITHUB_TOKEN are blocked by the repository settings and would not run CI.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example 0.12.0. Leave empty to compute it from the commits.
        required: false
        type: string
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

env:
  GIT_CLIFF: git-cliff==2.14.2
  GH_REPO: ${{ github.repository }}

jobs:
  authorize:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.pull_request.merged == true
          && github.event.pull_request.head.repo.full_name == github.repository
          && startsWith(github.event.pull_request.head.ref, 'release/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Allow only admins and maintainers
        env:
          GH_TOKEN: ${{ github.token }}
          # The user who started the run, merged the release PR, or re-ran a job.
          ACTOR: ${{ github.triggering_actor }}
        run: |
          role=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .role_name)
          if [ "$role" != admin ] && [ "$role" != maintain ]; then
            echo "::error title=Not allowed::$ACTOR has the $role role. Only admins and maintainers can release."
            exit 1
          fi

  prepare:
    needs: authorize
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Guard to main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error title=Invalid branch::Start a release from main."
          exit 1
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Choose the version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          version=${REQUESTED:-$(uvx "$GIT_CLIFF" --bumped-version)}
          version=${version#v}
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Invalid version::'$version' is not X.Y.Z."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error title=Version exists::Tag v$version already exists."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set the version and write the notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for package in timenet timenet-connectors; do
            uv version --package "$package" "$VERSION" --frozen
          done
          # Connectors needs the timenet release that ships with it.
          sed -i -E "s/\"timenet\[build\]>=[^\"]*\"/\"timenet[build]>=$VERSION\"/" packages/timenet-connectors/pyproject.toml
          grep -q "\"timenet\[build\]>=$VERSION\"" packages/timenet-connectors/pyproject.toml
          uv lock
          uvx "$GIT_CLIFF" --unreleased --tag "v$VERSION" --strip header --output "$RUNNER_TEMP/notes.md"
      - name: Open the release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          branch="release/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "chore(release): $VERSION"
          git push --force origin "$branch"
          {
            echo "Merging this PR tags v$VERSION, creates the GitHub release with the notes below, and"
            echo "starts the TestPyPI and PyPI publish runs for approval. To change the notes, edit"
            echo "them in the GitHub release after it is created."
            echo
            echo "---"
            echo
            cat "$RUNNER_TEMP/notes.md"
          } > "$RUNNER_TEMP/body.md"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$branch" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head "$branch" --title "chore(release): $VERSION" --body-file "$RUNNER_TEMP/body.md"
          fi

  release:
    needs: authorize
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Read the version
        id: version
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          version=$(uv version --package timenet --short)
          connectors=$(uv version --package timenet-connectors --short)
          if [ "$version" != "$connectors" ] || [ "release/v$version" != "$HEAD_REF" ]; then
            echo "::error title=Version mismatch::timenet $version, connectors $connectors, branch $HEAD_REF."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            # A re-run: the tag is already pushed. It must point at this release.
            if [ "$(git rev-parse "$tag^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "::error title=Tag mismatch::$tag exists on another commit."
              exit 1
            fi
          else
            git tag -a "$tag" -m "TimeNet $VERSION"
            git push origin "$tag"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            uvx "$GIT_CLIFF" --latest --strip header --output "$RUNNER_TEMP/notes.md"
            gh release create "$tag" --verify-tag --title "TimeNet $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi
      - name: Start the TestPyPI and PyPI publish runs
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for target in TestPyPI PyPI; do
            gh workflow run publish.yml --ref main -f target="$target" -f package=both -f ref="v$VERSION"
          done

  next-development-version:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          token: ${{ steps.app-token.outputs.token }}
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Open the development version PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASED: ${{ needs.release.outputs.version }}
        run: |
          for package in timenet timenet-connectors; do
            uv version --package "$package" --bump minor --bump dev=0 --frozen
          done
          uv lock
          next=$(uv version --package timenet --short)
          branch="chore/start-development-after-v$RELEASED"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "chore: start ${next%.dev0} development"
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$branch" --title "chore: start ${next%.dev0} development" \
              --body "Moves both packages to $next, so builds from main are not mistaken for the $RELEASED release."
          fi
