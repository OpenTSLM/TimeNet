name: Python package

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        uv sync --group dev
    - name: Lint with ruff
      run: |
        uv run ruff format --check .
        uv run ruff check .
        uv run ty check
    - name: Test with pytest
      run: |
        uv run pytest
