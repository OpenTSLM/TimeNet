[project]
site_name = "TimeNet"
site_description = "Register, query, download, convert, and explore time-series datasets in a shared TimeF format."
site_url = "https://docs.timenet.ai"
use_directory_urls = false

repo_url = "https://github.com/OpenTSLM/TimeNet"
repo_name = "OpenTSLM/TimeNet"
edit_uri = "edit/main/docs/"
docs_dir = "docs"

copyright = '© TimeNet contributors'

extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/extra.js"]

# TOML forbids multi-line inline tables, so each nav section is a single line.
nav = [
  { "Home" = "index.md" },
  { "Get started" = "get-started.md" },
  { "Learn" = [{ "Concepts" = "concepts.md" }, { "Data model" = [{ "Overview" = "data-model/index.md" }, { "Datasets" = "data-model/datasets.md" }, { "Samples" = "data-model/samples.md" }, { "Time series" = "data-model/time-series.md" }, { "Annotations" = "data-model/annotations.md" }, { "Tasks" = "data-model/tasks.md" }] }, { "Architecture" = "architecture.md" }, { "TimeF format" = [{ "Types" = "types.md" }, { "TimeFDataset" = "timef-dataset.md" }, { "Manifest" = "manifest.md" }, { "TimeFWriter" = "timef-writer.md" }, { "TimeFReader" = "timef-reader.md" }] }] },
  { "Datasets" = [{ "Use datasets" = [{ "The client (SDK)" = "client.md" }, { "Registries" = "registry.md" }, { "Load into your stack" = "usage.md" }] }, { "Build datasets" = [{ "Connectors" = "connectors.md" }, { "Curate & publish" = "curation.md" }] }, { "Catalog" = [{ "Datasets" = "catalog/datasets.md" }, { "Benchmarks" = "catalog/benchmarks.md" }] }] },
  { "CLI" = [{ "Overview" = "cli/index.md" }, { "timenet (consumer)" = "cli/timenet.md" }, { "timenet-curate (producer)" = "cli/curate.md" }] },
  # >>> api-nav: generated by scripts/gen_api_docs.py — do not edit >>>
  { "API Reference" = [{ "Overview" = "api/index.md" }, { "timenet.client" = "api/client.md" }, { "timenet.config" = "api/config.md" }, { "timenet.connectors" = "api/connectors.md" }, { "timenet.dataset" = "api/dataset.md" }, { "timenet.engine" = "api/engine.md" }, { "timenet.errors" = "api/errors.md" }, { "timenet.format" = "api/format.md" }, { "timenet.manifest" = "api/manifest.md" }, { "timenet.reader" = "api/reader.md" }, { "timenet.registry" = "api/registry.md" }, { "timenet.types" = "api/types.md" }, { "timenet.writer" = "api/writer.md" }, { "timenet_connectors.bases" = "api/bases.md" }, { "timenet_connectors.discovery" = "api/discovery.md" }] },
  # <<< api-nav <<<
]

#[project.extra.analytics]
#provider = "google"
#property = "G-XXXXXXXXXX"

#[project.extra.analytics.feedback]
#title = "Was this page helpful?"

#[[project.extra.analytics.feedback.ratings]]
#icon = "lucide/thumbs-up"
#name = "This page was helpful"
#data = 1
#note = "Thanks for your feedback!"

#[[project.extra.analytics.feedback.ratings]]
#icon = "lucide/thumbs-down"
#name = "This page could be improved"
#data = 0
#note = """
#  Thanks for your feedback! Help us improve this page by
#  <a href="https://github.com/OpenTSLM/TimeNet/issues" target="_blank" rel="noopener">creating an issue</a>.
#"""

[project.theme]
favicon = "assets/favicon.png"
features = [
  "navigation.instant",
  "navigation.tabs",
  "navigation.sections",
  "navigation.expand",
  "navigation.top",
  "navigation.indexes",
  "toc.follow",
  "content.code.copy",
  "content.code.annotate",
  "search.highlight",
  "search.suggest",
]

[project.theme.icon]
repo = "fontawesome/brands/github"
logo = "lucide/rocket"

# A roadmap callout, distinct from `warning` (a limitation you can hit today). The theme only ships
# CSS for its own admonition types, so the colors for `planned` live in stylesheets/extra.css.
[project.theme.icon.admonition]
planned = "lucide/construction"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon-star"
toggle.name = "Switch to system preference"

[project.extra]
generator = false

[[project.extra.social]]
icon = "lucide/house"
link = "https://timenet.ai"
name = "TimeNet Website"

[[project.extra.social]]
icon = "lucide/package"
link = "https://pypi.org/project/timenet/"
name = "TimeNet on PyPI"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/showcase/timenet-ai"
name = "TimeNet on LinkedIn"

[project.plugins.search]
[project.plugins.tags]

[project.plugins.mkdocstrings.handlers.python]
paths = ["packages/timenet/src", "packages/timenet-connectors/src"]
inventories = ["https://docs.python.org/3/objects.inv"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
inherited_members = true
show_source = false
show_root_heading = true
show_symbol_type_toc = true
show_if_no_docstring = true
separate_signature = true
show_signature_annotations = true
signature_crossrefs = true
filters = ["!^_"]

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [{ name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.pymdownx.tilde]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.keys]

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions.pymdownx.magiclink]
repo_url_shorthand = true
user = "OpenTSLM"
repo = "TimeNet"

[project.markdown_extensions.pymdownx.smartsymbols]
