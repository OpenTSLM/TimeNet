[project]
site_name = "TimeNet"
site_description = "Register, query, download, convert, and explore time-series datasets in a shared TimeF format."
site_url = "https://docs.timenet.ai"
use_directory_urls = false

repo_url = "https://github.com/OpenTSLM/TimeNet"
repo_name = "OpenTSLM/TimeNet"
edit_uri = "edit/main/docs/"
docs_dir = "docs"

copyright = '© TimeNet contributors'

extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/extra.js"]

# TOML forbids multi-line inline tables, so each nav section is a single line.
nav = [
  { "Home" = "index.md" },
  { "Get started" = "get-started.md" },
  { "Learn" = [{ "Concepts" = "concepts.md" }, { "Data model" = [{ "Overview" = "data-model/index.md" }, { "Datasets" = "data-model/datasets.md" }, { "Records" = "data-model/records.md" }, { "Sources" = "data-model/sources.md" }, { "Time series" = "data-model/time-series.md" }, { "Annotations" = "data-model/annotations.md" }, { "Tasks" = "data-model/tasks.md" }] }, { "Architecture" = "architecture.md" }, { "TimeF format" = [{ "On-disk format" = "timef-format.md" }, { "Types" = "types.md" }, { "TimeFDataset" = "timef-dataset.md" }, { "Manifest" = "manifest.md" }, { "TimeFWriter" = "timef-writer.md" }, { "TimeFReader" = "timef-reader.md" }] }] },
  { "Datasets" = [{ "Use datasets" = [{ "The client (SDK)" = "client.md" }, { "Registries" = "registry.md" }, { "Load into your stack" = "usage.md" }] }, { "Build datasets" = [{ "Connectors" = "connectors.md" }, { "Build & publish" = "build.md" }] }, { "Catalog" = [{ "Datasets" = "catalog/datasets.md" }, { "Benchmarks" = "catalog/benchmarks.md" }, { "Licensing" = "catalog/licensing.md" }] }] },
  { "CLI" = [{ "Overview" = "cli/index.md" }, { "timenet (consumer)" = "cli/timenet.md" }, { "timenet-build (producer)" = "cli/build.md" }] },
  # >>> api-nav: generated by scripts/gen_api_docs.py — do not edit >>>
  { "API Reference" = [{ "Overview" = "api/index.md" }, { "timenet.builders" = "api/timenet.builders.md" }, { "timenet.client" = "api/timenet.client.md" }, { "timenet.config" = "api/timenet.config.md" }, { "timenet.connectors" = "api/timenet.connectors.md" }, { "timenet.dataset" = "api/timenet.dataset.md" }, { "timenet.engine" = "api/timenet.engine.md" }, { "timenet.errors" = "api/timenet.errors.md" }, { "timenet.format" = "api/timenet.format.md" }, { "timenet.json" = "api/timenet.json.md" }, { "timenet.manifest" = "api/timenet.manifest.md" }, { "timenet.producer" = "api/timenet.producer.md" }, { "timenet.progress" = "api/timenet.progress.md" }, { "timenet.provenance" = "api/timenet.provenance.md" }, { "timenet.reader" = "api/timenet.reader.md" }, { "timenet.registry" = "api/timenet.registry.md" }, { "timenet.sources" = "api/timenet.sources.md" }, { "timenet.storage" = "api/timenet.storage.md" }, { "timenet.types" = "api/timenet.types.md" }, { "timenet.values_backends" = "api/timenet.values_backends.md" }, { "timenet.writer" = "api/timenet.writer.md" }, { "timenet_connectors.bases" = "api/timenet_connectors.bases.md" }, { "timenet_connectors.discovery" = "api/timenet_connectors.discovery.md" }, { "timenet_connectors.download" = "api/timenet_connectors.download.md" }, { "timenet_connectors.sources" = "api/timenet_connectors.sources.md" }, { "timenet_connectors.splitting" = "api/timenet_connectors.splitting.md" }, { "timenet_connectors.time_axes" = "api/timenet_connectors.time_axes.md" }] },
  # <<< api-nav <<<
]

#[project.extra.analytics]
